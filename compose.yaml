# Docker compose for the arm container (one service; launch = entrypoint ARG).
#
# The container runs as root, mounts the repo at /root/ws (the repo root IS
# the `arm` package) and uses the Dockerfile ENTRYPOINT `/root/run_arm.sh`,
# whose FIRST ARGUMENT selects what runs — there are NO separate compose files
# per part (sim vs hardware); they are picked with launch options/flags:
#
#   docker compose build arm                 # build the image (once)
#   docker compose run --rm arm              # REAL HARDWARE (controller + driver)
#   docker compose run --rm arm simulation   # controller only (sim provided externally)
#   docker compose run --rm arm bash         # dev shell / build in the workspace
#
# The USB serial binding (below) is only needed for the hardware run. On a host
# without the adapter, run `SERIAL_DEVICE=/dev/null docker compose run ...` (or
# use the wrapped workflow in the parent workspace, which hot-plugs the device).

services:
  arm:
    image: arm:latest
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /root/ws

    stdin_open: true
    tty: true

    volumes:
      - .:/root/ws

    # USB serial adapter for the FashionStar bus-servos (host:container).
    # Override the path with SERIAL_DEVICE=/dev/ttyUSB2 docker compose run ...
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"

    # dialout group: the group owning serial devices (matters if the process
    # UID is not root; running as root, access is granted regardless).
    group_add:
      - "20"