
arm_controller:
  ros__parameters:
    feedback_rate: 20.0
    feedback_frame: "base_link"
    reach_tolerance: 0.005
    reach_timeout: 15.0

    trajectory:
      enabled: true
      rate: 20.0
      max_speed: 0.08
      max_accel: 0.2

    motor_limits:
      max_speed: 30.0
      max_accel: 60.0

/**:
  ros__parameters:
    geometry:
      base_radius: 100.0
      platform_radius: 32.5
      upper_arm_len: 120.0
      lower_arm_len: 240.0

      servo_radius: 57.65
      servo_z: -22.5
      upper_rod_len: 60.0
      servo_rod_len: 35.0
      arm_attach_dist: 68.5
      arm_attach_offset: 20.5
      rod_spread: 8.0

      angle_min: [0.0, 0.0, 0.0]
      angle_max: [145.0, 145.0, 145.0]
      arm_angle_min: 0.0
      arm_angle_max: 180.0

      raw_motor_clamp: true

    sim:
      initial_pos: [0.0, 0.0, -0.28]
      simulate_arrival: true

arm_motor_driver:
  ros__parameters:
    baudrate: 115200
    servo_ids: [0, 1, 2]
    start_angles: [0.0, 0.0, 0.0]
    max_speed: 30.0
    auto_init: true
    targets_topic: "arm/motor_targets"
    offline_streak: 3

arm_manual_control:
  ros__parameters:
    step: 0.01

arm_interface:
  ros__parameters:
    home_position: [0.0, 0.0, -0.28]
    move_timeout: 10.0
    action_wait_timeout: 2.0
    cancel_timeout: 2.0
